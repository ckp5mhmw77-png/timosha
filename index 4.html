<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Суровый Флиппинг</title>
<style>
:root{--ac:#4f8cff;--w1:#1b1f3a;--w2:#0a0b12}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#050508;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#eef}
#ph{position:relative;width:min(410px,100vw);height:min(860px,calc(100vh - 20px));background:linear-gradient(160deg,var(--w1),var(--w2));border-radius:46px;border:9px solid #1d1d24;box-shadow:0 0 0 2px #444,0 25px 70px #000;display:flex;flex-direction:column;overflow:hidden}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#sb,#scr,#dock{position:relative;z-index:1}
#isl{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:104px;height:28px;background:#000;border-radius:20px;z-index:6}
#sb{display:flex;justify-content:space-between;padding:16px 26px 6px;font-size:13px;font-weight:600}
#scr{flex:1;overflow:auto;padding:10px 14px;scrollbar-width:none}
#dock{padding:8px 0 10px;display:flex;justify-content:center}
#hb{width:130px;height:6px;border-radius:3px;background:#fffa;cursor:pointer;box-shadow:0 0 0 12px transparent}
#toast{position:absolute;top:46px;left:12px;right:12px;background:#22242fee;border:1px solid #ffffff22;border-radius:20px;padding:11px 15px;font-size:13px;z-index:9;transform:translateY(-130px);transition:.35s;box-shadow:0 8px 24px #0008}
#toast.on{transform:none}
button{background:linear-gradient(180deg,#ffffff38,#fff0),var(--ac);color:#fff;border:0;border-radius:14px;padding:10px 15px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px #0007,inset 0 1px 0 #fff5;transition:.15s;margin:2px}
button:active{transform:scale(.95)}button:disabled{background:#333;color:#777;box-shadow:none;cursor:default}
button.g{background:#ffffff1c;box-shadow:inset 0 0 0 1px #ffffff2a}button.r{background:linear-gradient(180deg,#ffffff30,#fff0),#d63c3c}
button.sm{padding:6px 11px;font-size:12px;border-radius:11px}
button.gold{background:linear-gradient(90deg,#f7c948,#e8890c);color:#000;width:100%;padding:14px}
.hd{display:flex;align-items:center;gap:10px;margin:2px 0 12px;font-size:20px}.hd button{padding:5px 13px}
.c{background:#ffffff14;backdrop-filter:blur(10px);border:1px solid #ffffff1c;border-radius:20px;padding:13px;margin-bottom:11px;font-size:14px;line-height:1.4}
.c small{color:#aab}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;margin-top:14px;text-align:center;font-size:11px}
.ic{cursor:pointer;position:relative}.ic i{width:60px;height:60px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:30px;font-style:normal;margin:0 auto 5px;box-shadow:0 6px 14px #0008,inset 0 1px 0 #fff6}
.ic:active{transform:scale(.92)}.bd{position:absolute;top:-4px;right:6px;background:#ff3b30;border-radius:10px;padding:1px 6px;font-size:11px;font-weight:700}
input[type=number]{width:100%;background:#0006;color:#fff;border:1px solid #ffffff2a;border-radius:12px;padding:9px;margin:6px 0;font-size:15px}
input[type=range]{width:100%;accent-color:var(--ac)}
#mod{position:absolute;inset:0;background:#000b;z-index:8;display:none;align-items:center;justify-content:center;padding:14px}
#mod .box{background:#1f212c;border-radius:24px;padding:16px;width:100%;border:1px solid #ffffff22}
canvas.sg{background:#f6f5ef;border-radius:14px;touch-action:none;width:100%;display:block}
.bar{height:8px;background:#ffffff22;border-radius:5px;overflow:hidden;margin:6px 0}.bar div{height:100%;background:linear-gradient(90deg,var(--ac),#6fe);border-radius:5px}
.pg{animation:pg 2s linear forwards}@keyframes pg{from{width:0}to{width:100%}}
.ph{width:100%;height:118px;object-fit:cover;image-rendering:pixelated;border-radius:14px;margin-bottom:8px;display:block}
#chat{max-height:210px;overflow:auto;background:#0004;border-radius:14px;padding:6px 10px;margin-bottom:8px}
.m{max-width:84%;padding:7px 11px;border-radius:15px;margin:5px 0;font-size:13px;width:fit-content}.m.me{background:var(--ac);margin-left:auto}.m.sel{background:#ffffff22}.m.sys{background:#0007;margin:5px auto;font-size:12px;text-align:center;max-width:95%}
.sw{display:inline-block;width:36px;height:36px;border-radius:50%;margin:4px;border:2px solid #fff5;cursor:pointer}
#end{position:absolute;inset:0;background:#000;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;overflow:hidden}
#pl{font-size:60px;position:absolute;left:-80px;bottom:30%;animation:fly 6s forwards}
@keyframes fly{to{left:110%;bottom:80%;transform:rotate(-25deg) scale(.4)}}
</style></head><body>
<div id="ph"><canvas id="fx"></canvas><div id="isl"></div><div id="sb"></div><div id="toast"></div><div id="scr"></div>
<div id="dock"><div id="hb" onclick="go('home')"></div></div><div id="mod"></div><div id="end"></div></div>
<script>
const $=id=>document.getElementById(id),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,P=a=>a[R(0,a.length-1)],cl=(x,a,b)=>Math.max(a,Math.min(b,x));
const f=n=>Math.round(n).toLocaleString('ru-RU')+' ₽',hh=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(Math.floor(m%60)).padStart(2,'0');
const DN=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
let gameState={money:200000,day:1,min:480,rep:5,ci:60,sig:null,loans:[],ads:[],appts:[],own:[],notes:[],rev:[],news:[],mkt:1,unread:0,ach:{},sold:0,design:0,net:0,bought:0,maxDisc:0,uid:1,view:'home',ctx:null,over:false,modal:false,set:{fx:'stars',n:60,ac:'#4f8cff',wp:0}};
const G=gameState;
try{const s=JSON.parse(localStorage.getItem('flip'));if(s&&s.uid){Object.assign(G,s);G.view='home';G.modal=false;G.over=false;G.ads.forEach(a=>a.busy=0)}}catch(e){}
const APPS=[['cian','Циан','🏢','#3a78ff,#1a3fb0'],['cal','Календарь','📅','#ff6b6b,#c0262d'],['bank','Банки','🏦','#3ddc84,#157a43'],['prorab','Прораб','🔨','#ffb347,#c26a00'],['prof','Профиль','👤','#a97bff,#5a2fc0'],['gig','Подработка','🚕','#ffe14a,#b89500'],['news','Новости','📰','#3fd0e0,#0b7a8a'],['calc','Калькулятор','🧮','#999,#444'],['notes','Пуши','🔔','#ff8a4a,#b33a00'],['sleep','Сон','🌙','#4a50a0,#14163a'],['set','Настройки','⚙️','#9aa0aa,#3e4249']];
const TT={ad:'Объявление',insp:'Осмотр'};APPS.forEach(a=>TT[a[0]]=a[1]);
const TY=[['Убитая комната в коммуналке',12,20,45000],['Однушка под ремонт у промзоны',28,40,80000],['Двушка в хрущёвке',42,56,95000],['Сталинка с лепниной',60,90,140000],['Видовой пентхаус',90,150,230000]];
const DI=['Промзона','Спальный район','Центр','Старый фонд','Новостройки','Окраина'],CO=['Бабушкин треш','Бетон','Косметика','Уставший евро'],CM=[.8,.75,.95,1.05];
const DEF={sewer:'Гнилая чугунная канализация',rel:'Прописанный родственник',bugs:'Клопы/плесень за плинтусом',noise:'Шумные соседи',clean:'Идеальная чистота'};
const CH=[['🚰 Стояки',2200,'sewer',.85,0,'Покажите стояки и трубы',25,'Да смотрите, всё там нормально…'],['🔨 Стены',2500,'bugs',.75,0,'Постучу по стенам, гляну плинтуса',25,'Эээ… ну стучите, только аккуратно.'],['🗣 Соседи',3000,'noise',.65,0,'Схожу к соседям, поспрашиваю',40,'Соседи у нас золотые, зачем вам к ним?'],['📄 ЕГРН −1 500 ₽',2000,'rel',.95,1500,'Закажу выписку из ЕГРН',60,'Пожалуйста, мне скрывать нечего.']];
const BK=[['ГосБанк 🟢',80,.001,15e6],['Тинь-Банк 🟡',50,.003,3e6],['Быстро-Деньги МФО 🔴',0,.015,5e5]];
const RP=[['Косметика',3000,1,2,15,20],['Капиталка',9000,3,5,35,50],['Дизайнерский',20000,6,10,80,120]];
const A=[['Первый кусок бетона',()=>G.bought>=1],['Сделка века',()=>G.maxDisc>2e5],['Любимчик банков',()=>G.ci>=95],['Евроремонтник',()=>G.design>=3],['Миллионер из хрущобы',()=>G.net>=5e7]];
const EV=[['Ставки по ипотеке снижены — спрос растёт',1.08],['Кризис: цены падают',.92],['Рядом с хрущёвками построят метро',1.06],['Скандал с застройщиком, рынок лихорадит',.94],['Льготная ипотека продлена',1.05]];
const GIG=[['🚕 Такси',2,3500],['📦 Грузчик',4,6500],['📣 Раздача листовок',1,1500]];
const AC=['#4f8cff','#ff5e8a','#3ddc84','#ffb347','#a97bff'],WP=[['#1b1f3a','#0a0b12'],['#3a1b2f','#12060d'],['#12362f','#04110e'],['#2b2b2b','#050505'],['#3a2a10','#100800']];
const night=()=>G.min<420||G.min>=1320,inWin=a=>a.day==G.day&&Math.abs(G.min-a.t)<=30;
const mult=()=>G.rep>=4.5?1:G.rep>=4?1.15:1.3,price=a=>Math.round(a.base*mult()*G.mkt*(1-a.disc)),ov=o=>Math.round(o.val*G.mkt);
const save=()=>{try{localStorage.setItem('flip',JSON.stringify(G))}catch(e){}};
function toast(m){const t=$('toast');t.textContent=m;t.className='on';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',3200)}
function push(m){G.notes.unshift({d:G.day,t:hh(G.min),m});G.unread++;toast(m)}
function pic(a){if(a.img)return a.img;let s=a.id*9301+49297;const r=()=>(s=(s*9301+49297)%233280)/233280,c=document.createElement('canvas');c.width=64;c.height=40;const x=c.getContext('2d'),t=a.tp;
 x.fillStyle=['#7ec8ff','#ffb27a','#a98cff','#9ad0ff'][a.id%4];x.fillRect(0,0,64,40);x.fillStyle='#ffe27a';x.fillRect(52,4,6,6);x.fillStyle='#4a8a3a';x.fillRect(0,34,64,6);x.fillStyle='#777';x.fillRect(0,37,64,3);
 const fl=[3,5,5,4,8][t],w=[30,34,34,36,26][t],x0=(64-w)/2|0,h=fl*5+2,y0=34-h;
 x.fillStyle=a.cond==3?'#e6e6e0':['#8a7a6a','#b0b0a8','#c9c2b0','#d9c9a0','#5f8fb0'][t];x.fillRect(x0,y0,w,h);x.fillStyle='#444';x.fillRect(x0-1,y0-2,w+2,2);
 for(let i=0;i<fl;i++)for(let j=0;j<(w-4)/6|0;j++){x.fillStyle=r()<.3?'#ffe27a':'#2a3a55';x.fillRect(x0+3+j*6,y0+3+i*5,3,3)}
 x.fillStyle='#3a2a1a';x.fillRect(x0+(w/2|0)-1,31,3,3);
 if(t==3){x.fillStyle='#fff';for(let j=0;j<5;j++)x.fillRect(x0+2+j*7,y0+h-10,1,10)}
 if(a.cond==0){x.fillStyle='#4a3a2a';for(let i=0;i<9;i++)x.fillRect(x0+(r()*w|0),y0+(r()*h|0),2,1)}
 return a.img=c.toDataURL()}
function gen(){const r=Math.random(),i=r<.25?0:r<.55?1:r<.8?2:r<.93?3:4,T=TY[i],ar=R(T[1],T[2]),mv=Math.round(ar*T[3]*(.85+Math.random()*.3)/1000)*1000,c=R(0,3);
 let d=['clean'];if(Math.random()>.15)d=['sewer','rel','bugs','noise'].sort(()=>Math.random()-.5).slice(0,R(1,2));
 return{id:G.uid++,tp:i,name:T[0],dist:P(DI),fl:R(1,12),ar,mv,cond:c,base:Math.round(mv*CM[c]/1000)*1000,def:d,found:{},chk:{},disc:0,refuse:Math.random()<.4,chat:[],busy:0}}
function fill(){while(G.ads.length<6)G.ads.push(gen())}
function sb(){$('sb').innerHTML=`<span>${hh(G.min)} · ${DN[(G.day-1)%7]} · д.${G.day}</span><span>${f(G.money)}</span><span>🔋${Math.max(5,Math.floor(100-((G.min-480+1440)%1440)/1440*90))}%</span>`}
function addMin(n){G.min+=n;while(G.min>=1440){G.min-=1440;G.day++;dayEnd()}tick()}
function tick(){
 G.appts=G.appts.filter(a=>{if(a.started)return true;if(a.day<G.day||(a.day==G.day&&G.min>a.t+30)){const ad=G.ads.find(x=>x.id==a.ad);G.rep=Math.max(1,G.rep-.4);G.rev.unshift('★1 «Не пришёл, потратил моё время» — продавец ('+(ad?ad.name:'объект')+')');push('😡 Вы пропустили встречу. Рейтинг −0.4');return false}
 if(inWin(a)&&!a.pushed){a.pushed=1;push('📅 Встреча в '+hh(a.t)+' — пора на осмотр!')}return true});
 sb();if(G.view=='cal'||G.view=='home')render();checkAch()}
function checkAch(){A.forEach((a,i)=>{if(!G.ach[i]&&a[1]()){G.ach[i]=1;push('🏆 Ачивка: '+a[0])}})}
function dayEnd(){
 G.loans.forEach(l=>l.amt*=1+l.rate);G.money-=1000;
 if(G.money<0){G.ci=Math.max(0,G.ci-10);push('⚠️ Нехватка средств при списании. КИ −10')}
 G.own.forEach(o=>{if(o.st=='rep'&&--o.left<=0){o.st='done';finRep(o)}});
 if(G.day%3==0){const e=P(EV);G.mkt=cl(G.mkt*e[1],.8,1.25);G.news.unshift({d:G.day,m:e[0]+' (рынок ×'+G.mkt.toFixed(2)+')'});push('📰 '+e[0])}
 G.ads=G.ads.filter(a=>G.appts.some(p=>p.ad==a.id));fill();
 if(G.loans.length)push('🏦 Проценты начислены. Долг: '+f(G.loans.reduce((s,l)=>s+l.amt,0)));
 if(G.ci<=0&&G.money<0)over();save()}
function finRep(o){let g=1+o.gain/100;const d=o.def;if(d.includes('rel'))g-=.15;if(d.includes('noise'))g-=.05;if(d.includes('clean'))g+=.05;if(d.includes('sewer')&&o.type==0)g-=.12;
 o.val=Math.round(o.mv*g);if(o.type==2)G.design++;push('🔨 Ремонт «'+o.name+'» завершён. Оценка: '+f(ov(o)))}
function doSleep(){if(!(G.min>=1320||G.min<420))return toast('Спать можно только после 22:00');
 if(G.min>=1320){G.day++;G.min=480;dayEnd()}else G.min=480;push('☀️ Доброе утро! Вы выспались.');tick();render()}
function go(v,c){G.view=v;G.ctx=c;if(v=='notes')G.unread=0;render()}
const curP=()=>G.appts.find(x=>x.id==G.ctx),cur=()=>G.ads.find(x=>x.id==curP().ad);
function render(){
 if(G.view=='insp'&&!curP())G.view='cal';sb();checkAch();const v=G.view;
 $('scr').innerHTML=(v=='home'?'':`<div class=hd><button class=g onclick="go('home')">‹</button><b>${TT[v]}</b></div>`)+V[v]();
 const c=$('chat');if(c)c.scrollTop=1e5}
const ph=a=>`<img class=ph src="${pic(a)}">`;
const V={
home(){const bg={cal:G.appts.filter(inWin).length,notes:G.unread};
 return`<div class=c style="text-align:center"><div style="font-size:38px;font-weight:700">${hh(G.min)}</div>${DN[(G.day-1)%7]}, день ${G.day}<br><small>⭐${G.rep.toFixed(2)} · КИ ${G.ci} · 🏠 ${G.own.length} · рынок ×${G.mkt.toFixed(2)}</small></div><div class=grid>${APPS.map(a=>`<div class=ic onclick="go('${a[0]}')"><i style="background:linear-gradient(145deg,${a[3]})">${a[2]}</i>${a[1]}${bg[a[0]]?`<span class=bd>${bg[a[0]]}</span>`:''}</div>`).join('')}</div>`},
cian(){return(G.rep<4?'<div class=c style="color:#ff9">Низкий рейтинг: цены завышены, часть продавцов не ответит.</div>':'')+G.ads.map(a=>`<div class=c>${ph(a)}<b>${a.name}</b><br><small>${a.dist} · ${a.fl} эт. · ${a.ar} м² · ${CO[a.cond]}</small><br><b style="font-size:17px">${f(price(a))}</b><button class=sm style="float:right" onclick="go('ad',${a.id})">Открыть</button></div>`).join('')},
ad(){const a=G.ads.find(x=>x.id==G.ctx);if(!a)return'<div class=c>Объявление снято</div>';const e=G.appts.find(p=>p.ad==a.id);
 return`<div class=c>${ph(a)}<b>${a.name}</b><br><small>${a.dist} · ${a.fl} эт. · ${a.ar} м² · ${CO[a.cond]}</small><br><b style="font-size:17px">${f(price(a))}</b></div>`+(e?`<div class=c>Встреча: ${e.day==G.day?'сегодня':'завтра'} в ${hh(e.t)}</div>`:`<div class=c>Назначить встречу:<br>${slots(a)||'<small>Нет слотов (ночью продавцы спят)</small>'}</div>`)},
cal(){const l=G.appts.slice().sort((a,b)=>a.day*2000+a.t-b.day*2000-b.t);return l.length?l.map(a=>{const ad=G.ads.find(x=>x.id==a.ad);return`<div class=c>${a.day==G.day?'Сегодня':'Завтра'} ${hh(a.t)} — ${ad?ad.name:''}<br>${inWin(a)||a.started?`<button onclick="start(${a.id})">Прийти на осмотр</button>`:'<small>Ждите времени встречи (±30 мин)</small>'}</div>`}).join(''):'<div class=c>Встреч нет. Загляните в Циан.</div>'},
insp(){const a=cur(),sv=a.sv||8,fnd=Object.keys(a.found).filter(k=>k!='clean').length;
 return`<div class=c>${ph(a)}<b>${a.name}</b> · <b>${f(price(a))}</b><div id=chat>${a.chat.map(m=>`<div class="m ${m.w}">${m.t}</div>`).join('')}${a.busy?'<div class="m sel">печатает…</div>':''}</div>${a.busy?'<div class=bar><div class=pg style="animation-duration:2.2s"></div></div>':''}
 <small>Проверки (шанс заметить):</small><br>${CH.map((c,i)=>`<button class="sm g" ${a.chk[i]||a.busy?'disabled':''} onclick="chk(${i})">${c[0]} ${c[3]*100}%</button>`).join('')}</div>
 <div class=c><b>Торг</b> <small>(найденные косяки повышают шанс)</small><input type=range id=hs min=1 max=30 value=${sv} oninput=hupd()><div id=hi>${hi(a,sv)}</div><button ${a.busy?'disabled':''} onclick="bid()">Предложить</button></div>
 <button ${a.busy?'disabled':''} onclick="buy(${a.id})">Купить за ${f(price(a))}</button><button class=g onclick="leave(${a.id})">Уйти</button>`},
bank(){if(night())return'<div class=c>🌙 Банки закрыты (22:00–07:00).</div>';const has=G.loans.length>0;
 return`<div class=c>📊 Кредитный рейтинг: <b>${G.ci}</b>/100<br><small>Новый кредит — только после погашения текущего.</small></div>`+G.loans.map((l,i)=>`<div class=c>${BK[l.b][0]}<br>Долг <b>${f(l.amt)}</b> (${l.rate*100}%/день)<br><button class=sm onclick="repay(${i})">Погасить</button></div>`).join('')+BK.map((b,i)=>`<div class=c><b>${b[0]}</b><br><small>КИ ≥ ${b[1]} · ${b[2]*100}%/день · до ${f(b[3])}</small><input id=ln${i} type=number placeholder="Сумма" ${has?'disabled':''}><button class=sm ${has?'disabled':''} onclick="take(${i})">Взять кредит</button></div>`).join('')},
prorab(){if(!G.own.length)return'<div class=c>Нет объектов. Купите квартиру на Циане.</div>';return G.own.map(o=>{let b='';
 if(o.st=='raw')b=RP.map((r,i)=>`<button class=sm onclick="repair(${o.id},${i})">${r[0]} · ${f(rc(o,i))}</button>`).join('');
 else if(o.st=='rep')b=`<small>Ремонт, осталось дней: ${o.left}</small><div class=bar><div style="width:${100-o.left/o.tot*100}%"></div></div>`;
 else b=`Оценка: <b>${f(ov(o))}</b><input id=sp${o.id} type=number value="${ov(o)}"><button class=sm onclick="sell(${o.id})">Продать</button>`;
 return`<div class=c><img class=ph src="${o.img}"><b>${o.name}</b> <small>${o.ar} м² · куплено за ${f(o.buy)}</small><br>${b}</div>`}).join('')},
prof(){const all=A.every((a,i)=>G.ach[i]);return`<div class=c>⭐ ${G.rep.toFixed(2)} / 5.0 · КИ ${G.ci}<br>Чистая прибыль: ${f(G.net)}<br>ЭЦП:<br>${G.sig?`<img src="${G.sig}" style="background:#f6f5ef;border-radius:8px;width:150px">`:'нет'}<br><button class="sm r" onclick="reissue()">Перевыпустить ЭЦП −50 000 ₽</button></div>
<div class=c><b>Ачивки</b><br>${A.map((a,i)=>`${G.ach[i]?'✅':'⬜'} ${a[0]}`).join('<br>')}</div><div class=c><b>Отзывы</b><br>${G.rev.slice(0,5).join('<br>')||'<small>пусто</small>'}</div>${all&&G.money>5e7?'<button class=gold onclick="finish()">✈️ Купить билет в США и визу инвестора</button>':''}`},
notes(){return G.notes.length?G.notes.slice(0,40).map(n=>`<div class=c><small>день ${n.d}, ${n.t}</small><br>${n.m}</div>`).join(''):'<div class=c>Пока тихо.</div>'},
sleep(){const ok=G.min>=1320||G.min<420;return`<div class=c style="text-align:center;font-size:50px">🌙</div><div class=c>Спать можно с 22:00 до 07:00.<br><small>Утром: проценты по кредиту, ремонт +1 день, −1 000 ₽ на жизнь.</small><br><br><button ${ok?'':'disabled'} onclick="doSleep()">Лечь спать</button>${ok?'':'<br><small>Сейчас '+hh(G.min)+' — рано.</small>'}</div>`},
gig(){const n=night();return`<div class=c>Деньги на мели? Подработай. <small>(работать можно с 07:00 до 22:00)</small></div>`+GIG.map((g,i)=>`<div class=c>${g[0]} · ${g[1]} ч · ~${f(g[2])}<br><button class=sm ${n?'disabled':''} onclick="work(${i})">Работать</button></div>`).join('')},
news(){return`<div class=c>📈 Коэффициент рынка: <b>×${G.mkt.toFixed(2)}</b> <small>(влияет на цены и оценки)</small></div>`+(G.news.map(n=>`<div class=c><small>день ${n.d}</small><br>${n.m}</div>`).join('')||'<div class=c>Новостей пока нет.</div>')},
calc(){return`<div class=c>Цена покупки<input id=k1 type=number oninput=kc()>Ремонт<input id=k2 type=number oninput=kc()>Цена продажи<input id=k3 type=number oninput=kc()>Дней в кредите МФО (1.5%/день)<input id=k4 type=number oninput=kc()><div id=ko style="margin-top:8px"></div></div>`},
set(){const s=G.set;return`<div class=c><b>Фон-эффект</b><br>${[['none','Нет'],['stars','✨ Звёзды'],['rain','🌧 Дождь'],['snow','❄️ Снег'],['bubbles','🫧 Пузыри']].map(e=>`<button class="sm ${s.fx==e[0]?'':'g'}" onclick="setS('fx','${e[0]}')">${e[1]}</button>`).join('')}<br><small>Плотность</small><input type=range min=10 max=150 value=${s.n} onchange="setS('n',+this.value)"></div>
<div class=c><b>Акцентный цвет</b><br>${AC.map(c=>`<span class=sw style="background:${c}" onclick="setS('ac','${c}')"></span>`).join('')}<br><b>Обои</b><br>${WP.map((w,i)=>`<span class=sw style="background:linear-gradient(${w[0]},${w[1]})" onclick="setS('wp',${i})"></span>`).join('')}</div><div class=c><button class=r onclick="resetG()">🗑 Сбросить игру</button></div>`}};
function setS(k,v){G.set[k]=v;applySet();render();save()}
function applySet(){const r=document.documentElement.style,w=WP[G.set.wp];r.setProperty('--ac',G.set.ac);r.setProperty('--w1',w[0]);r.setProperty('--w2',w[1]);fxInit()}
function resetG(){if(confirm('Сбросить весь прогресс?')){try{localStorage.removeItem('flip')}catch(e){}location.reload()}}
const hc=(a,p)=>cl(.97-p*.032+Object.keys(a.found).filter(k=>k!='clean').length*.03-(a.found.clean?.04:0)-a.disc*.5+(G.rep-4.5)*.06,.03,.95);
const hi=(a,p)=>`Скидка <b>${p}%</b> (−${f(a.base*mult()*G.mkt*p/100)}) · шанс согласия <b>${Math.round(hc(a,p)*100)}%</b>`;
function hupd(){const a=cur(),p=+$('hs').value;a.sv=p;$('hi').innerHTML=hi(a,p)}
function kc(){const v=i=>+$('k'+i).value||0,p=v(1)+v(2),it=p*(Math.pow(1.015,v(4))-1),pr=v(3)-p-it;$('ko').innerHTML=`Вложения: ${f(p)}<br>Проценты МФО: ${f(it)}<br>Прибыль: <b style="color:${pr>=0?'#4cd964':'#ff6b6b'}">${f(pr)}</b> (${p?Math.round(pr/p*100):0}%)`}
function work(i){const g=GIG[i];if(night())return;const m=Math.round(g[2]*(.8+Math.random()*.4));G.money+=m;addMin(g[1]*60);push('💵 '+g[0]+': +'+f(m));render()}
function slots(a){let o='';[0,1].forEach(d=>[600,720,840,990,1080,1200].forEach(t=>{if(d==0&&(t<=G.min+30||night()))return;if(G.appts.some(p=>p.day==G.day+d&&p.t==t))return;o+=`<button class="sm g" onclick="book(${a.id},${d},${t})">${d?'Завтра':'Сегодня'} ${hh(t)}</button>`}));return o}
function book(id,d,t){const a=G.ads.find(x=>x.id==id);if(G.rep<4&&a.refuse){G.ads=G.ads.filter(x=>x.id!=id);push('🚫 «С перекупами с низким рейтингом дел не имеем»');return go('cian')}
 G.appts.push({id:G.uid++,ad:id,day:G.day+d,t});push('📅 Встреча назначена на '+hh(t));render()}
function start(id){const p=G.appts.find(x=>x.id==id);p.started=1;const a=G.ads.find(x=>x.id==p.ad);if(!a.chat.length)a.chat.push({w:'sel',t:'Здравствуйте! Проходите, смотрите, всё как на фото.'});go('insp',id)}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function act(a,me,ms,fn){if(a.busy)return;a.busy=1;a.chat.push({w:'me',t:me});render();await wait(ms);a.busy=0;fn();if(G.view=='insp'||G.view=='cal')render();save()}
function chk(i){const a=cur(),c=CH[i];if(a.busy||a.chk[i])return;if(G.money<c[4])return toast('Не хватает денег');
 act(a,c[5],c[1],()=>{G.money-=c[4];a.chat.push({w:'sel',t:c[7]});let nm='';
  if(a.def.includes(c[2])&&Math.random()<c[3]){a.found[c[2]]=1;nm=DEF[c[2]]}
  if(i==1&&a.def.includes('clean')&&Math.random()<c[3]){a.found.clean=1;nm=DEF.clean}
  a.chk[i]=1;a.chat.push({w:'sys',t:nm?'🔎 Выяснили: '+nm:'🔎 Ничего подозрительного не нашли'});addMin(c[6])})}
function bid(){const a=cur(),p=+$('hs').value,pid=curP().id,ok=Math.random()<hc(a,p);if(a.busy)return;
 act(a,`Скиньте ${p}%, и я забираю.`,1800,()=>{
  if(ok){a.disc=Math.min(.5,a.disc+p/100);G.maxDisc=Math.max(G.maxDisc,a.base*mult()*G.mkt*p/100);a.chat.push({w:'sel',t:P(['Ладно, уболтали…','Хм… по рукам.','Эх, ну давайте.'])},{w:'sys',t:'✅ Скидка '+p+'% принята. Цена: '+f(price(a))})}
  else{G.ads=G.ads.filter(x=>x.id!=a.id);G.appts=G.appts.filter(x=>x.id!=pid);G.rep=Math.max(1,G.rep-.05);push('💢 Продавец сорвал сделку: «Ищите дурака в другом месте!»');go('cal')}})}
function leave(id){G.appts=G.appts.filter(x=>x.ad!=id);go('cal')}
function buy(id){const a=G.ads.find(x=>x.id==id),pr=price(a);if(G.money<pr)return toast('Не хватает '+f(pr-G.money));
 sign('Договор купли-продажи',`${a.name}. Сумма: ${f(pr)}`,()=>{G.money-=pr;G.own.push({id:G.uid++,name:a.name,ar:a.ar,mv:a.mv,def:a.def,buy:pr,spent:0,st:'raw',img:pic(a)});G.bought++;G.rep=Math.min(5,G.rep+.05);
 G.ads=G.ads.filter(x=>x.id!=id);G.appts=G.appts.filter(x=>x.ad!=id);push('🏠 Куплено: '+a.name);go('prorab')})}
const rc=(o,i)=>Math.round(o.ar*RP[i][1]*(o.def.includes('sewer')?1.3:1)+(o.def.includes('bugs')?40000:0));
function repair(id,i){const o=G.own.find(x=>x.id==id),c=rc(o,i),r=RP[i];if(G.money<c)return toast('Не хватает денег');G.money-=c;o.spent+=c;o.st='rep';o.type=i;o.gain=R(r[4],r[5]);o.left=R(r[2],r[3]);
 if(Math.random()<.15){o.left+=2;push('🍺 Бригада ушла в запой: +2 дня')}o.tot=o.left;if(o.def.includes('bugs'))push('🪳 Вскрыты клопы: оплачена дезинсекция');render()}
function sell(id){const o=G.own.find(x=>x.id==id),p=+$('sp'+id).value;if(!(p>0))return;const r=p/ov(o),ch=r<=1.05?1:r>=1.3?0:(1.3-r)/.25;
 if(Math.random()>ch){addMin(60);toast('Покупатели не берут по такой цене. Прошёл час.');return render()}
 sign('Договор продажи',`${o.name}. Сумма: ${f(p)}`,()=>{G.money+=p;G.net+=p-o.buy-o.spent;G.sold++;G.rep=Math.min(5,G.rep+.05);G.own=G.own.filter(x=>x.id!=id);push('💰 Продано за '+f(p)+'. Прибыль: '+f(p-o.buy-o.spent));go('prorab')})}
function take(i){if(G.loans.length)return toast('Сначала погасите текущий кредит');const b=BK[i],a=+$('ln'+i).value;if(!(a>0))return;
 if(G.ci<b[1])return toast('❌ Отказ: низкий кредитный рейтинг');if(a>b[3])return toast('Превышен лимит банка');
 sign('Кредитный договор',`${b[0]}: ${f(a)} под ${b[2]*100}% в день`,()=>{G.money+=a;G.loans.push({b:i,amt:a,rate:b[2],day:G.day});push('🏦 Кредит одобрен: '+f(a));render()})}
function repay(i){const l=G.loans[i];if(G.money<l.amt)return toast('Не хватает денег');G.money-=l.amt;
 if(l.day==G.day){G.ci=Math.max(0,G.ci-5);push('🏦 Банк не успел заработать. КИ −5')}else{G.ci=Math.min(100,G.ci+R(2,4));push('🏦 Кредит погашен. КИ растёт')}G.loans.splice(i,1);render()}
function reissue(){if(G.money<50000)return toast('Нужно 50 000 ₽');G.money-=50000;G.sig=null;addMin(120);reg(()=>{toast('Новая ЭЦП выпущена');render()})}
function sign(t,d,cb,isReg){G.modal=true;const m=$('mod');m.style.display='flex';
 m.innerHTML=`<div class=box><b>${t}</b><br><small>${d}</small><br><br><canvas class=sg id=cv width=320 height=130></canvas><div id=er style="color:#ff8a8a;font-size:12px;min-height:18px"></div>
 <button id=ok>${isReg?'Сохранить образец':'Подписать'}</button><button class=g id=cr>Очистить</button>${isReg?'':'<button class="g sm" id=fg>Забыл / аннулировать подпись −50 000 ₽</button><button class="g sm" id=cx>Отмена</button>'}</div>`;
 const c=$('cv'),x=c.getContext('2d');x.lineWidth=2.5;x.lineCap='round';x.strokeStyle='#112';let dr=false,pts=0,st=0;
 const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=e=>{dr=true;st++;const[a,b]=pos(e);x.beginPath();x.moveTo(a,b);c.setPointerCapture(e.pointerId)};
 c.onpointermove=e=>{if(!dr)return;const[a,b]=pos(e);x.lineTo(a,b);x.stroke();pts++};c.onpointerup=()=>dr=false;
 $('cr').onclick=()=>{x.clearRect(0,0,c.width,c.height);pts=st=0};
 $('ok').onclick=()=>{if(pts<25||st<1){$('er').textContent='Подпись слишком короткая или поле пустое';return}if(isReg)G.sig=c.toDataURL();m.style.display='none';G.modal=false;cb()};
 if(!isReg){$('cx').onclick=()=>{m.style.display='none';G.modal=false};
  $('fg').onclick=()=>{if(G.money<50000){$('er').textContent='Нет 50 000 ₽ на перевыпуск';return}m.style.display='none';G.modal=false;G.money-=50000;G.sig=null;addMin(120);reg(()=>toast('ЭЦП перевыпущена. Договор аннулирован — подпишите заново.'))}}}
function reg(cb){sign('Регистрация ЭЦП','Нарисуйте свою подпись — это ваша электронная подпись',cb,true)}
function over(){G.over=true;try{localStorage.removeItem('flip')}catch(e){}const e=$('end');e.style.display='flex';e.innerHTML=`<h1>💀 Банкротство</h1><p>Дней: ${G.day}<br>Сделок: ${G.sold}</p><button onclick="location.reload()">Начать заново</button>`}
function finish(){G.over=true;const e=$('end');e.style.display='flex';e.innerHTML='<div id=pl>✈️</div><h2 style="opacity:0;animation:fi 1s 6s forwards">Welcome to USA 🇺🇸</h2><style>@keyframes fi{to{opacity:1}}</style>';
 setTimeout(()=>{e.innerHTML=`<h1>🎉 Титры</h1><p>Вы свалили в закат.<br><br>Дней: <b>${G.day}</b><br>Продано: <b>${G.sold}</b><br>Дизайнерских ремонтов: <b>${G.design}</b><br>Чистая прибыль: <b>${f(G.net)}</b><br>Баланс: <b>${f(G.money)}</b><br>КИ: <b>${G.ci}</b> · Рейтинг: <b>${G.rep.toFixed(2)}</b></p><button onclick="resetG()">Сыграть ещё</button>`},7500)}
let PS=[];const fxc=$('fx'),fxx=fxc.getContext('2d');
function fxInit(){fxc.width=fxc.clientWidth;fxc.height=fxc.clientHeight;PS=[];for(let i=0;i<G.set.n;i++)PS.push({x:Math.random()*fxc.width,y:Math.random()*fxc.height,s:Math.random()*2+.6,v:Math.random()*2+.5,p:Math.random()*6})}
function fxLoop(t){const w=fxc.width,h=fxc.height,e=G.set.fx;fxx.clearRect(0,0,w,h);fxx.fillStyle=fxx.strokeStyle='#fff';
 PS.forEach(p=>{if(e=='stars'){fxx.globalAlpha=.3+.7*Math.abs(Math.sin(t/700+p.p));fxx.fillRect(p.x,p.y,p.s,p.s)}
 else if(e=='rain'){p.y+=p.v*6;if(p.y>h)p.y=-10;fxx.globalAlpha=.3;fxx.beginPath();fxx.moveTo(p.x,p.y);fxx.lineTo(p.x-2,p.y+11);fxx.stroke()}
 else if(e=='snow'){p.y+=p.v*.7;p.x+=Math.sin(t/900+p.p)*.4;if(p.y>h)p.y=-5;fxx.globalAlpha=.75;fxx.beginPath();fxx.arc(p.x,p.y,p.s,0,7);fxx.fill()}
 else if(e=='bubbles'){p.y-=p.v*.6;if(p.y<-10)p.y=h+10;fxx.globalAlpha=.3;fxx.beginPath();fxx.arc(p.x,p.y,p.s*4,0,7);fxx.stroke()}});requestAnimationFrame(fxLoop)}
fill();applySet();requestAnimationFrame(fxLoop);render();
if(!G.sig)reg(()=>{push('Добро пожаловать в Суровый Флиппинг!');render()});
setInterval(()=>{if(G.over||G.modal)return;addMin(2)},1000);setInterval(save,4000);
</script></body></html>
